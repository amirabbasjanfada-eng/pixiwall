<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Offline by design: only this app's own origin plus data:/blob: URLs may load. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; worker-src blob:; connect-src 'self' data: blob:">
<title>PixiWall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #stage { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; touch-action: none;
           -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage canvas { display: block; }
  #error { position: fixed; left: 8px; right: 8px; bottom: 8px; margin: 0; padding: 8px; z-index: 10;
           font: 11px/1.35 monospace; color: #ffb4a8; background: rgba(0, 0, 0, .75);
           white-space: pre-wrap; pointer-events: none; }
  #error:empty { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="pixi.min.js"></script>
<script src="runtime.js"></script>
</body>
</html>
